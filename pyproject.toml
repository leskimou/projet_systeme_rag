[project]
name = "code-projet9"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "langchain-community>=0.3",
    "langchain-mistralai>=0.2",
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "langchain-community==0.3.27",
    "ragas==0.3.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "ragas: real RAGAs evaluation tests requiring Mistral API + vector_db (run with -m ragas)",
]
addopts = "-m \"not ragas\""
